name: Library request
description: Ask for elements to be added to the Seed43 Element Library (steel, timber, fixings, bolts) for a country or supplier.
title: "Library request: "
labels: ["library request"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for asking. Tell us which elements you want in the Element Library and where the sizes come from.

        **Please supply links to the data if you can**: the manufacturer's product pages, catalogue PDFs or size tables
        with the dimensions. Elements built from published data are exact; without a source some sizes have to be estimated.

        Please do not attach client drawings or anything confidential.
  - type: input
    id: region
    attributes:
      label: Country or region
      placeholder: e.g. New Zealand, Australia, United Kingdom
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: Kind of element
      multiple: true
      options:
        - Steel sections
        - Cold-formed purlins and girts
        - Timber (sawn)
        - Engineered timber (LVL, glulam, I-joists)
        - Fixings (hangers, brackets, plates)
        - Bolts and anchors
        - Other
    validations:
      required: true
  - type: input
    id: supplier
    attributes:
      label: Manufacturer or supplier
      placeholder: e.g. Lysaght, Pryda, Hyne, Carter Holt Harvey
  - type: textarea
    id: products
    attributes:
      label: Products and sizes
      description: The product range or the sizes you need.
      placeholder: e.g. Pryda framing anchors, all sizes; Stramit C and Z purlins
    validations:
      required: true
  - type: textarea
    id: source
    attributes:
      label: Links to the data
      description: If possible, links to public product pages, catalogue PDFs or size tables with the dimensions (one per line). The more exact the source, the more exact the elements.
      placeholder: |
        https://
        https://
  - type: textarea
    id: notes
    attributes:
      label: Anything else
      description: How you want them drawn, grades or treatments, or which ones matter most.
